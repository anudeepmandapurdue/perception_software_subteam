[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kart-perception"
version = "0.1.0"
description = "Offline LiDAR obstacle detection baseline for an autonomous go-kart"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ingestion = ["Pillow>=10,<13"]

[project.scripts]
kart-perception = "kart_perception.cli:main"
kart-ingest = "kart_perception.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]
